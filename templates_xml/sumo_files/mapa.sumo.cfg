<?xml version="1.0" encoding="UTF-8"?>
<configuration> 
    <input>
        <net-file value="cuenca.net.xml"/>
        <route-files value="rutas_generadas_distribution.rou.xml"/>
        <additional-files value="cuenca.poly.xml,additional.xml, vtypes.add.xml"/>
    </input>    

 <output>
   	 <tripinfo-output value="tripinfo.xml"/>
     <fcd-output value="fcd.xml"/>
   
 
</output>


<emissions>
	<device.emissions.probability value="1"/>
</emissions>

    
    <processing>
        <ignore-route-errors value="true"/>
    </processing>    
    <time>
        <begin value="0"/>
        <end value="3600"/>
        <step-length value="1"/>
    </time>
</configuration> 
